name: Auto Status Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # รันทุกๆ 5 นาที
  workflow_dispatch: # ให้กดรันมือเองได้จากหน้าเว็บ GitHub

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write # อนุญาตให้เขียนไฟล์กลับเข้า Repo ได้
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Monitor Script
        run: node monitor.js

      - name: Commit and push changes if status changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update status.json [skip ci]" && git push)